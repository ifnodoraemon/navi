[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-assistant"
version = "1.1.2"
description = "Local-first agent OS for a governed personal AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.29",
    "questionary>=2.0",
    "httpx-sse>=0.4",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "coverage[toml]>=7.13",
]

[project.scripts]
navi = "navi.cli:app"

[tool.setuptools.package-data]
navi = [
    "specs/*.yaml",
    "skills/*/SKILL.md",
    "telegram/specs/*.yaml",
    "weixin/specs/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls the configured real model provider and is opt-in via NAVI_LIVE_LLM_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.coverage.run]
branch = true
source = ["src/navi"]
omit = [
    "src/navi/_engine_phases.py",
    "src/navi/acceptance.py",
    "src/navi/actions/*",
    "src/navi/api.py",
    "src/navi/api_paths.py",
    "src/navi/app_factory.py",
    "src/navi/auth.py",
    "src/navi/cli.py",
    "src/navi/cli_providers.py",
    "src/navi/config.py",
    "src/navi/connector_runtime.py",
    "src/navi/control.py",
    "src/navi/core_tools/*",
    "src/navi/cron.py",
    "src/navi/daemon.py",
    "src/navi/diagnostics.py",
    "src/navi/db.py",
    "src/navi/engine_approval_prompts.py",
    "src/navi/engine_types.py",
    "src/navi/evals.py",
    "src/navi/evolution.py",
    "src/navi/execution.py",
    "src/navi/goals.py",
    "src/navi/governance.py",
    "src/navi/graph.py",
    "src/navi/hooks.py",
    "src/navi/intent_agent.py",
    "src/navi/json_utils.py",
    "src/navi/lifecycle.py",
    "src/navi/operating_context.py",
    "src/navi/paths.py",
    "src/navi/prompt_os.py",
    "src/navi/prompting.py",
    "src/navi/rag.py",
    "src/navi/recovery.py",
    "src/navi/result.py",
    "src/navi/runtime.py",
    "src/navi/runs/_approval_store.py",
    "src/navi/runs/_execution_log_store.py",
    "src/navi/runs/_watch_store.py",
    "src/navi/runs/store.py",
    "src/navi/service.py",
    "src/navi/skills.py",
    "src/navi/subagents.py",
    "src/navi/syscalls.py",
    "src/navi/telegram/*",
    "src/navi/text_utils.py",
    "src/navi/weixin/*",
]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = true
