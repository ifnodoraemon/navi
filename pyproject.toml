[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-assistant"
version = "0.1.0"
description = "Local-first personal AI assistant with connector support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "coverage[toml]>=7.13",
]

[project.scripts]
navi = "navi.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls the configured real model provider and is opt-in via NAVI_LIVE_LLM_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["src/navi"]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = true
