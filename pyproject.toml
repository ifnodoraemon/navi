[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-assistant"
version = "2.0.4"
description = "Local-first agent OS for a governed personal AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=1.27,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.29",
    "questionary>=2.0",
    "httpx-sse>=0.4",
    "sse-starlette>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "coverage[toml]>=7.13",
    "ruff>=0.12",
    "build>=1.2",
]

[project.scripts]
navi = "navi.cli:app"

[tool.setuptools.package-data]
navi = [
    "specs.json",
    "specs/*.yaml",
    "skills/*/SKILL.md",
    "telegram/specs/*.yaml",
    "weixin/specs/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls the configured real model provider and is opt-in via NAVI_LIVE_LLM_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
mypy_path = "typings"

[tool.coverage.run]
branch = true
source = ["src/navi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
