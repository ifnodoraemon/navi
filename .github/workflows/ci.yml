name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate eval datasets
        run: |
          navi eval daily --validate-only --dataset evals/daily_journeys.yaml
          navi eval connector --validate-only --dataset evals/connector_journeys.yaml
          navi eval claw --validate-only --dataset evals/claw_navi.yaml

      - name: Lint
        run: ruff check src tests tests_e2e

      - name: Type check
        run: mypy src/navi

      - name: Test with coverage report
        run: pytest --cov=src/navi --cov-report=term-missing -q -W error::pytest.PytestUnraisableExceptionWarning

      - name: Test end-to-end contracts
        run: pytest -q tests_e2e -m "not live_llm"

  trace-ui:
    name: Trace UI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: trace_web_ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: trace_web_ui

      - name: Lint
        run: npm run lint
        working-directory: trace_web_ui

      - name: Build packaged assets
        run: npm run build
        working-directory: trace_web_ui

      - name: Verify generated assets are current
        run: git diff --exit-code -- src/navi/static/trace

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/navi-wheel-smoke
          /tmp/navi-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/navi-wheel-smoke/bin/navi model
          /tmp/navi-wheel-smoke/bin/python -c "from importlib.resources import files; assert (files('navi') / 'static' / 'trace' / 'index.html').is_file()"
