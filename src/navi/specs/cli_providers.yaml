- name: codex
  binary: codex
  version_args:
    - --version
  auth_status_args:
    - login
    - status
  auth_negative_markers:
    - not logged in
    - error
  auth_detail: ""
  supports_execution: true
- name: gemini
  binary: gemini
  version_args:
    - --version
  auth_status_args: []
  auth_negative_markers: []
  auth_detail: installed; auth is verified when a headless prompt runs
  supports_execution: false
