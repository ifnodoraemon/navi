- name: codex
  binary: codex
  version_args:
    - --version
  auth_files:
    - ~/.codex/auth.json
  auth_detail: OpenAI Codex CLI auth file
  supports_execution: true
- name: qwen
  binary: qwen
  version_args:
    - --version
  auth_status_args:
    - auth
    - status
  auth_negative_markers:
    - not logged in
    - credentials not found
    - login required
  auth_files:
    - ~/.qwen/oauth_creds.json
  auth_detail: Qwen OAuth credentials
  supports_execution: false
- name: claude
  binary: claude
  version_args:
    - --version
  auth_status_args:
    - auth
    - status
  auth_negative_markers:
    - not logged in
    - login required
    - unauthenticated
  auth_detail: Claude CLI auth status
  supports_execution: false
- name: gemini
  binary: gemini
  version_args:
    - --version
  auth_status_args:
    - auth
    - status
  auth_negative_markers:
    - not logged in
    - login required
    - unauthenticated
  auth_detail: Gemini CLI auth status
  supports_execution: false
