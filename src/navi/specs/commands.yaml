objects:
  task:
    command: /task
    affordance: Use /task create <natural-language request> to submit local actions into Navi's tracked task path.
    actions:
      create:
        usage: /task create <request>
      show:
        usage: /task show [task-id]
      list:
        usage: /task list
  watch:
    command: /watch
    affordance: Use /watch create <cron> <natural-language request> and /watch list for recurring checks.
    actions:
      create:
        usage: /watch create <minute> <hour> <day> <month> <weekday> <request>
      list:
        usage: /watch list
  approval:
    command: /approval
    affordance: Use /approval approve <code>, /approval reject <code>, and /approval list for approvals.
    actions:
      approve:
        usage: /approval approve <code>
      reject:
        usage: /approval reject <code>
      list:
        usage: /approval list
help:
  - /task create <request>
  - /task show [task-id]
  - /task list
  - /watch create <minute> <hour> <day> <month> <weekday> <request>
  - /watch list
  - /approval approve <code>
  - /approval reject <code>
  - /approval list
  - /help
aliases:
  help:
    - /help
    - /?
