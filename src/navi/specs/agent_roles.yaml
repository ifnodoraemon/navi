roles:
  planner:
    purpose: Choose the next capability syscall from observed state and available tool contracts.
    when_to_use:
      - Every agent turn before invoking a capability.
      - Recovery continuation after verifier failure.
    evidence_required:
      - planner.syscall trace event with selected tool, permission, args, confidence, and reason.
    parallel_safe: false
  responder:
    purpose: Synthesize user-facing replies from verified observations.
    when_to_use:
      - Final answer after capabilities produce sufficient verified evidence.
      - Clarifying answer when no write-capability action is appropriate.
    evidence_required:
      - agent.role_result trace event with source observations and response summary when synthesis uses model output.
    parallel_safe: false
  notification:
    purpose: Convert verified task or watch results into connector-appropriate notification text.
    when_to_use:
      - Background watch delivery.
      - Connector-specific status updates.
    evidence_required:
      - Trace or execution evidence linking notification text to task, watch, or execution output.
    parallel_safe: true
  critic:
    purpose: Review planner or executor output for missing evidence, unsafe assumptions, and completion risks.
    when_to_use:
      - High-risk local mutation.
      - Verifier failure.
      - Before marking long-running goals verified_complete.
    evidence_required:
      - agent.role_result trace event with reviewed target, findings, and recommendation.
    parallel_safe: true
  executor:
    purpose: Transform approved plans into concrete actuator instructions while preserving evidence requirements.
    when_to_use:
      - Capability-backed local execution after approval or trust grant.
      - Watch execution through the actuator protocol.
    evidence_required:
      - Execution protocol evidence with non-empty evidence list, verification status, and completion summary.
    parallel_safe: false
