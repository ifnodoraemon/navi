- name: session.request_elevation
  capability_class: session
  execution_contexts: [turn, workflow_step]
  handler: session_request_elevation
  description: "Request temporary elevation of the session's permission ceiling. Elevates from current level (e.g., read) to a higher level (prepare, write, execute)."
  routing_hints:
    - "Only use this when a capability you need is genuinely not in the tool manifest due to permission ceiling. Most tools (shell.run, file.write, web.search, etc.) should already be available at write permission level. Check the manifest first before escalating."
  input_schema:
    type: object
    properties:
      target_permission:
        type: string
        enum: [prepare, write, execute]
      reason:
        type: string
    required:
      - target_permission
      - reason
  output_schema:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
      approval_code:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
  facts_only: true
  mutates: true
  permission: read
  source: action
