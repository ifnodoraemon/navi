- name: final.answer
  capability_class: conversation
  execution_contexts: [turn, actuator, react, workflow_step]
  handler: final_answer
  description: Return a final user-facing message.
  routing_hints:
    - "Route ordinary conversation, advice, and unstructured output to conversational capabilities."
    - "When factual accuracy matters, prefer using a read/search capability first. But if the answer is conversational or the model has sufficient context from prior observations, answering directly is fine."
    - "Do not use final.answer to answer current tool, skill, service, provider, task, workflow, or connector inventory/status questions when a declared read capability can return current facts first."
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: ask.user
  capability_class: conversation
  execution_contexts: [turn, actuator, workflow_step]
  handler: clarify
  description: Ask the user a question to clarify requirements or present multiple choices for a decision, suitable for human-in-the-loop workflows.
  input_schema:
    type: object
    properties:
      message:
        type: string
        description: The question or context to present to the user.
      options:
        type: array
        items:
          type: string
        description: Optional list of explicit choices for the user to pick from.
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: delegate.spawn
  capability_class: delegation
  execution_contexts: [turn, workflow_step]
  handler: delegate_spawn
  description: "Create a narrowly-scoped delegation run for a specific, verified step. Must only be used after gathering sufficient local facts via foreground tools."
  routing_hints:
    - "FACT-FIRST: Never spawn a delegation blindly. Always use file.read, shell.run, or system.info to confirm the environment, locate files, and gather facts BEFORE creating a delegation."
    - "GATED DELEGATION: Break complex requests into smaller, single-purpose delegations. Do not create massive 'do everything' tasks."
    - "LOCAL-FIRST: For simple/safe queries like checking a status, reading a file, or running 'grep'/'find', use shell.run directly in the foreground. Avoid the overhead of delegate.spawn for read-only lookups."
  input_schema:
    type: object
    properties:
      objective:
        type: string
        description: The main goal of this delegation.
      context:
        type: string
        description: Relevant background information, gathered facts, and constraints.
      plan:
        type: string
        description: A high-level step-by-step plan for the subagent to follow.
      success_criteria:
        type: string
        description: How to verify that the delegation succeeded.
    required:
      - objective
      - context
      - plan
      - success_criteria
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      goal_id:
        type: string
      workspace:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.prepare
  capability_class: delegation
