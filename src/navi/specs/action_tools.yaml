- name: final.answer
  handler: final_answer
  description: Return a final user-facing message.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: clarify.ask
  handler: clarify
  description: Return one user-facing clarification question.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: delegate.spawn
  handler: delegate_spawn
  description: Create a tracked delegation run record.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
    required:
      - prompt
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      goal_id:
        type: string
      workspace:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.prepare
  handler: delegate_prepare
  description: Prepare an existing delegation run and return preparation facts.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      plan_summary:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: approval.request
  handler: approval_request
  description: Create an approval request for a delegation run.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      approval:
        type: object
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.run
  handler: delegate_run
  description: Queue a delegation run that has an execution grant.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: watch.create
  handler: watch_create
  description: Create a scheduled watch record.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
      cron:
        type: string
      run_at:
        type: number
      run_at_text:
        type: string
      kind:
        type: string
    required:
      - prompt
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      watch_id:
        type: string
      cron:
        type: string
      kind:
        type: string
      prompt:
        type: string
      next_run_at:
        type: number
      next_run_text:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.delete
  handler: delegate_delete
  description: Delete delegation run records by id or by supported cleanup filters.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      status:
        type: string
      source:
        type: string
      kind:
        type: string
      limit:
        type: integer
    required: []
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      deleted:
        type: boolean
      deleted_count:
        type: integer
      remaining_count:
        type: integer
      cleanup_complete:
        type: boolean
      deleted_runs:
        type: array
        items:
          type: object
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: watch.delete
  handler: watch_delete
  description: Permanently delete a recurring watch by watch id.
  input_schema:
    type: object
    properties:
      watch_id:
        type: string
    required:
      - watch_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      watch_id:
        type: string
      deleted:
        type: boolean
      cron:
        type: string
      prompt:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: approval.resolve
  handler: approval_resolve
  description: Resolve a pending approval by code or delegation run id.
  input_schema:
    type: object
    properties:
      decision:
        type: string
        enum:
          - approve
          - reject
      code:
        type: string
      run_id:
        type: string
    required:
      - decision
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      approval_status:
        type: string
      run_status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: delegate.retry
  handler: execution_retry
  description: Execute one follow-up attempt for a delegation run.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      follow_up_prompt:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      result_summary:
        type: string
      error:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
