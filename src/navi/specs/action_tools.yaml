- name: final.answer
  handler: final_answer
  description: Return a direct answer to the user when no more tool call is needed.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: clarify.ask
  handler: clarify
  description: Ask one concise clarification question when a user-owned fact is required, or when a recurring schedule has no exact time.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: delegate.spawn
  handler: delegate_spawn
  description: Spawn a tracked delegation run for controlled local work, engineering investigation, bug diagnosis, config-to-runtime mapping, performance investigation, or code changes without preparing, approving, or running it.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
    required:
      - prompt
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: delegate.prepare
  handler: delegate_prepare
  description: Run one preparation pass for an existing delegation run and return preparation facts.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: approval.request
  handler: approval_request
  description: Request approval for a prepared delegation run without running it.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: delegate.run
  handler: delegate_run
  description: Run a delegation only when it already has an execution grant.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: watch.create
  handler: watch_create
  description: Create a recurring watch only when an exact cron expression can be derived.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
      cron:
        type: string
    required:
      - prompt
      - cron
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: delegate.delete
  handler: delegate_delete
  description: Delete delegation runs. Use run_id for one explicit failed run, or status=failed with optional source/kind to clean all matching failed run records without touching active runs. Use limit only for an intentionally partial cleanup.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      status:
        type: string
      source:
        type: string
      kind:
        type: string
      limit:
        type: integer
    required: []
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: watch.delete
  handler: watch_delete
  description: Permanently delete a recurring watch by watch id.
  input_schema:
    type: object
    properties:
      watch_id:
        type: string
    required:
      - watch_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: approval.resolve
  handler: approval_resolve
  description: Approve or reject a pending delegation run with an approval code or run id.
  input_schema:
    type: object
    properties:
      decision:
        type: string
        enum:
          - approve
          - reject
      code:
        type: string
      run_id:
        type: string
    required:
      - decision
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: delegate.retry
  handler: execution_retry
  description: Run one explicit follow-up execution attempt for an already approved or trusted delegation after observing its current status and logs.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      follow_up_prompt:
        type: string
    required:
      - run_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
