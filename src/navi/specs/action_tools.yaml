- name: final.answer
  handler: final_answer
  description: Return a final user-facing message.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: ask.user
  handler: clarify
  description: Ask the user a question to clarify requirements or present multiple choices for a decision. Use this for human-in-the-loop workflows.
  input_schema:
    type: object
    properties:
      message:
        type: string
        description: The question or context to present to the user.
      options:
        type: array
        items:
          type: string
        description: Optional list of explicit choices for the user to pick from.
    required:
      - message
  output_schema:
    type: object
    properties:
      message:
        type: string
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: delegate.spawn
  handler: delegate_spawn
  description: "Create a tracked delegation run record to execute complex local shell commands, apply codebase changes, or perform background engineering diagnosis."
  input_schema:
    type: object
    properties:
      prompt:
        type: string
    required:
      - prompt
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      goal_id:
        type: string
      workspace:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.prepare
  handler: delegate_prepare
  description: Prepare an existing delegation run and return preparation facts.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      plan_summary:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: approval.request
  handler: approval_request
  description: Create an approval request for a delegation run.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      approval:
        type: object
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.run
  handler: delegate_run
  description: Queue a delegation run that has an execution grant.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: watch.create
  handler: watch_create
  description: Create a scheduled watch record.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
      cron:
        type: string
      run_at:
        type: number
      run_at_text:
        type: string
      kind:
        type: string
        enum: ["once", "recurring"]
    required:
      - prompt
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      watch_id:
        type: string
      cron:
        type: string
      kind:
        type: string
      prompt:
        type: string
      next_run_at:
        type: number
      next_run_text:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: delegate.delete
  handler: delegate_delete
  description: Delete delegation run records by id or by supported cleanup filters.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      status:
        type: string
      source:
        type: string
      kind:
        type: string
      limit:
        type: integer
    required: []
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      deleted:
        type: boolean
      deleted_count:
        type: integer
      remaining_count:
        type: integer
      cleanup_complete:
        type: boolean
      deleted_runs:
        type: array
        items:
          type: object
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: watch.delete
  handler: watch_delete
  description: Permanently delete a recurring watch by watch id.
  input_schema:
    type: object
    properties:
      watch_id:
        type: string
    required:
      - watch_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      watch_id:
        type: string
      deleted:
        type: boolean
      cron:
        type: string
      prompt:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: approval.resolve
  handler: approval_resolve
  description: Resolve a pending approval by code or delegation run id.
  input_schema:
    type: object
    properties:
      decision:
        type: string
        enum:
          - approve
          - reject
      code:
        type: string
      run_id:
        type: string
    required:
      - decision
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      approval_status:
        type: string
      run_status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: delegate.retry
  handler: execution_retry
  description: Execute one follow-up attempt for a delegation run.
  input_schema:
    type: object
    properties:
      run_id:
        type: string
      follow_up_prompt:
        type: string
    required:
      - run_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      status:
        type: string
      result_summary:
        type: string
      error:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: workflow.propose
  handler: workflow_propose
  description: Propose a governed dynamic workflow with declared subagent steps and verification strategy.
  input_schema:
    type: object
    properties:
      objective:
        type: string
      permission_ceiling:
        type: string
      max_concurrency:
        type: integer
      total_subagent_limit:
        type: integer
      risk_class:
        type: string
      estimated_cost:
        type: string
      stop_condition:
        type: string
      verification_strategy:
        type: string
      plan:
        type: object
      steps:
        type: array
        items:
          type: object
    required:
      - objective
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
      confirmation_required:
        type: boolean
      permission_ceiling:
        type: string
      max_concurrency:
        type: integer
      total_subagent_limit:
        type: integer
      step_count:
        type: integer
  facts_only: true
  mutates: true
  permission: prepare
  source: action
- name: workflow.approve
  handler: workflow_approve
  description: Approve or reject a proposed dynamic workflow before it can run.
  input_schema:
    type: object
    properties:
      workflow_id:
        type: string
      decision:
        type: string
        enum:
          - approve
          - reject
    required:
      - workflow_id
      - decision
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: workflow.run
  handler: workflow_run
  description: Run the next bounded batch of an approved dynamic workflow through declared capabilities.
  input_schema:
    type: object
    properties:
      workflow_id:
        type: string
    required:
      - workflow_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
      completed_count:
        type: integer
      failed_count:
        type: integer
      pending_count:
        type: integer
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: workflow.verify
  handler: workflow_verify
  description: Run verifier checks for a completed dynamic workflow and mark it verified or blocked.
  input_schema:
    type: object
    properties:
      workflow_id:
        type: string
    required:
      - workflow_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
      verifier_passed:
        type: boolean
      blocked_reason:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: workflow.resume
  handler: workflow_resume
  description: Resume an approved, running, or interrupted dynamic workflow from persisted step state.
  input_schema:
    type: object
    properties:
      workflow_id:
        type: string
    required:
      - workflow_id
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
- name: workflow.status
  handler: workflow_status
  description: Inspect one dynamic workflow, including step state, evidence, and lifecycle events.
  input_schema:
    type: object
    properties:
      workflow_id:
        type: string
    required:
      - workflow_id
  output_schema:
    type: object
    properties:
      workflow:
        type: object
      steps:
        type: array
        items:
          type: object
      events:
        type: array
        items:
          type: object
      step_count:
        type: integer
      pending_count:
        type: integer
      completed_count:
        type: integer
      failed_count:
        type: integer
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: session.request_elevation
  handler: session_request_elevation
  description: "Request temporary elevation of the session's permission ceiling (e.g., from read to prepare or write). Required before calling capabilities that demand permissions above the current ceiling. If the user verbally authorizes an action but you lack permission, you MUST call this tool to trigger the actual system-level permission elevation workflow."
  input_schema:
    type: object
    properties:
      target_permission:
        type: string
        enum: [prepare, write, execute]
      reason:
        type: string
    required:
      - target_permission
      - reason
  output_schema:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
      approval_code:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
  facts_only: true
  mutates: true
  permission: read
  source: action
