- name: approval.resolve
  capability_class: approval
  execution_contexts: [turn, workflow_step]
  handler: approval_resolve
  description: Resolve a pending approval by explicit code, current run id, or an explicit visible approval selection.
  routing_hints:
    - "For approval resolution, preserve explicit approval codes as arguments rather than consuming them. DO NOT attempt to resolve an approval (e.g. calling approval.resolve) unless the user explicitly provides an approval code or explicitly asks to approve/reject."
    - "For phrases like approve all, do not invent codes. Use selection=latest_visible_batch only when the user explicitly asks to approve/reject all visible/current approvals."
  input_schema:
    type: object
    properties:
      decision:
        type: string
        enum:
          - approve
          - reject
      code:
        type: string
      run_id:
        type: string
      selection:
        type: string
        enum:
          - explicit_code
          - current_run
          - latest_visible_batch
          - all_visible
    required:
      - decision
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      run_id:
        type: string
      approval_status:
        type: string
      run_status:
        type: string
  facts_only: true
  mutates: true
  permission: write
  source: action
