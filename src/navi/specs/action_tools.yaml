- name: watch.create
  capability_class: watch
  execution_contexts: [turn, workflow_step]
  handler: watch_create
  description: Create a scheduled watch record.
  routing_hints:
    - "Use watch.create only when the user supplied a sufficiently specific recurring schedule or one-shot time. If the timing is only a broad part of day or otherwise ambiguous, ask.user for clarification instead of inventing a default time."
    - "For one-shot reminders or pushes with a natural-language time, set kind=once and pass run_at_text from the user's wording. Do not call shell.run just to compute the current timestamp."
  input_schema:
    type: object
    properties:
      prompt:
        type: string
      cron:
        type: string
      run_at:
        type: number
      run_at_text:
        type: string
      kind:
        type: string
        enum: ["once", "recurring"]
    required:
      - prompt
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      watch_id:
        type: string
      cron:
        type: string
      kind:
        type: string
      prompt:
        type: string
      next_run_at:
        type: number
      next_run_text:
        type: string
  facts_only: true
  mutates: true
  permission: prepare
  source: action
