  description: Propose a governed dynamic workflow with declared subagent steps and verification strategy.
  routing_hints:
    - "For workflow.propose, declare plan.goal_type as planning only when the workflow is meant to produce planning evidence without external capability execution; execution goals need declared tool_calls."
  input_schema:
    type: object
    properties:
      objective:
        type: string
      permission_ceiling:
        type: string
      max_concurrency:
        type: integer
      total_subagent_limit:
        type: integer
      risk_class:
        type: string
      estimated_cost:
        type: string
      stop_condition:
        type: string
      verification_strategy:
        type: string
      plan:
        type: object
      steps:
        type: array
        items:
          type: object
    required:
      - objective
  output_schema:
    type: object
    properties:
      entity_type:
        type: string
      entity_id:
        type: string
      state_transition:
        type: string
      turn_scope:
        type: string
      workflow_id:
        type: string
      status:
        type: string
      confirmation_required:
        type: boolean
      permission_ceiling:
        type: string
      max_concurrency:
        type: integer
      total_subagent_limit:
        type: integer
      step_count:
        type: integer
