- name: final.answer
  handler: final_answer
  description: Return a direct answer to the user when no more tool call is needed.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: clarify.ask
  handler: clarify
  description: Ask one concise clarification question when a user-owned fact is required, or when a recurring schedule has no exact time.
  input_schema:
    type: object
    properties:
      message:
        type: string
    required:
      - message
  output_schema:
    type: object
  facts_only: true
  mutates: false
  permission: read
  source: action
- name: task.record
  handler: task_record
  description: Record a tracked local task for controlled local work, engineering investigation, bug diagnosis, config-to-runtime mapping, performance investigation, or code changes without preparing, approving, or queueing it.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
    required:
      - prompt
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: task.prepare
  handler: task_prepare
  description: Run one preparation pass for an existing tracked task and return preparation facts.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
      - task_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: approval.request
  handler: approval_request
  description: Request approval for a prepared task without queueing it.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
      - task_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: task.queue
  handler: task_queue
  description: Queue a task only when it already has an execution grant.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
      - task_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: watch.create
  handler: watch_create
  description: Create a recurring watch only when an exact cron expression can be derived.
  input_schema:
    type: object
    properties:
      prompt:
        type: string
      cron:
        type: string
    required:
      - prompt
      - cron
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: prepare
  source: action
- name: task.delete
  handler: task_delete
  description: Delete tracked tasks. Use task_id for one explicit task, or status=failed with optional source/kind to clean all matching failed task records without touching active tasks. Use limit only for an intentionally partial cleanup.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      status:
        type: string
      source:
        type: string
      kind:
        type: string
      limit:
        type: integer
    required: []
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: watch.delete
  handler: watch_delete
  description: Permanently delete a recurring watch by watch id.
  input_schema:
    type: object
    properties:
      watch_id:
        type: string
    required:
      - watch_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: approval.resolve
  handler: approval_resolve
  description: Approve or reject a pending task with an approval code or task id.
  input_schema:
    type: object
    properties:
      decision:
        type: string
        enum:
          - approve
          - reject
      code:
        type: string
      task_id:
        type: string
    required:
      - decision
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
- name: execution.retry
  handler: execution_retry
  description: Run one explicit follow-up execution attempt for an already approved or trusted task after observing its current status and logs.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      follow_up_prompt:
        type: string
    required:
      - task_id
  output_schema:
    type: object
  facts_only: false
  mutates: true
  permission: write
  source: action
