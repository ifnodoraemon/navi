defaults:
  read:
    risk_class: low
    sensitive_contexts: []
    confirmation_required: false
    reason: Read-only capability with no declared sensitive context.
  prepare:
    risk_class: medium
    sensitive_contexts:
      - task_control
    confirmation_required: false
    reason: Preparation capability can create or update managed state before approval.
  write:
    risk_class: high
    sensitive_contexts:
      - local_state
    confirmation_required: true
    reason: Write capability can mutate local or external state and requires confirmation.
tools:
  browser.screenshot:
    risk_class: high
    sensitive_contexts:
      - browser
      - untrusted_web
      - artifact_write
    confirmation_required: true
    reason: Browser capture reads untrusted web content and writes an artifact.
  directory.list:
    risk_class: medium
    sensitive_contexts:
      - directory
    confirmation_required: false
    reason: Directory listing exposes local directory metadata.
  file.read:
    risk_class: medium
    sensitive_contexts:
      - filesystem
      - untrusted_local_content
    confirmation_required: false
    reason: File reads may expose local content that must be treated as untrusted data.
  file.write:
    risk_class: high
    sensitive_contexts:
      - filesystem
      - local_state
    confirmation_required: true
    reason: File writes mutate local project state.
  git.status:
    risk_class: medium
    sensitive_contexts:
      - repository
    confirmation_required: false
    reason: Git status exposes repository state.
  shell.run:
    risk_class: high
    sensitive_contexts:
      - terminal
      - local_state
    confirmation_required: true
    reason: Shell execution can mutate or inspect the local environment.
  test.run:
    risk_class: high
    sensitive_contexts:
      - terminal
      - local_state
    confirmation_required: true
    reason: Test commands execute local processes.
  memory.list:
    risk_class: medium
    sensitive_contexts:
      - memory
    confirmation_required: false
    reason: Memory listing exposes durable assistant memory.
  memory.recall:
    risk_class: medium
    sensitive_contexts:
      - memory
    confirmation_required: false
    reason: Memory recall exposes selected durable assistant memory.
  memory.conflicts:
    risk_class: medium
    sensitive_contexts:
      - memory
    confirmation_required: false
    reason: Memory conflict listing exposes durable assistant memory relationships.
  delegate.spawn:
    risk_class: medium
    sensitive_contexts:
      - task_control
    confirmation_required: false
    reason: Delegation spawn creates a managed task record but does not execute it.
  delegate.prepare:
    risk_class: medium
    sensitive_contexts:
      - task_control
    confirmation_required: false
    reason: Delegation prepare updates a managed task before approval or execution.
  approval.request:
    risk_class: medium
    sensitive_contexts:
      - task_control
      - approval
    confirmation_required: false
    reason: Approval request creates a user-facing approval record.
  approval.resolve:
    risk_class: high
    sensitive_contexts:
      - task_control
      - approval
    confirmation_required: true
    reason: Approval resolution can queue or reject managed execution.
  delegate.run:
    risk_class: high
    sensitive_contexts:
      - task_control
      - local_state
    confirmation_required: true
    reason: Delegation run queues approved or trusted execution.
  delegate.delete:
    risk_class: high
    sensitive_contexts:
      - task_control
    confirmation_required: true
    reason: Delegation delete removes managed task records.
  delegate.retry:
    risk_class: high
    sensitive_contexts:
      - task_control
      - local_state
    confirmation_required: true
    reason: Delegation retry re-enters execution for a managed task.
  delegate.status:
    risk_class: medium
    sensitive_contexts:
      - task_control
    confirmation_required: false
    reason: Delegation status exposes managed task and approval metadata.
  delegate.list:
    risk_class: medium
    sensitive_contexts:
      - task_control
    confirmation_required: false
    reason: Delegation list exposes managed task and watch metadata.
  watch.create:
    risk_class: medium
    sensitive_contexts:
      - scheduled_activity
    confirmation_required: false
    reason: Watch create schedules future managed work but does not execute immediately.
  watch.delete:
    risk_class: high
    sensitive_contexts:
      - scheduled_activity
    confirmation_required: true
    reason: Watch delete removes scheduled work.
  workflow.propose:
    risk_class: medium
    sensitive_contexts:
      - dynamic_workflow
      - task_control
    confirmation_required: false
    reason: Workflow propose creates a governed orchestration plan but does not execute it.
  workflow.approve:
    risk_class: high
    sensitive_contexts:
      - dynamic_workflow
      - approval
    confirmation_required: true
    reason: Workflow approval permits a dynamic orchestration to run.
  workflow.run:
    risk_class: high
    sensitive_contexts:
      - dynamic_workflow
      - task_control
      - local_state
    confirmation_required: true
    reason: Workflow run executes declared subagent steps through capabilities.
  workflow.verify:
    risk_class: high
    sensitive_contexts:
      - dynamic_workflow
      - verification
    confirmation_required: true
    reason: Workflow verify marks a completed orchestration as verified or blocked.
  workflow.resume:
    risk_class: high
    sensitive_contexts:
      - dynamic_workflow
      - task_control
    confirmation_required: true
    reason: Workflow resume continues persisted dynamic orchestration state.
  workflow.status:
    risk_class: medium
    sensitive_contexts:
      - dynamic_workflow
    confirmation_required: false
    reason: Workflow status exposes orchestration state, step evidence, and events.
  web.search:
    risk_class: low
    sensitive_contexts:
      - web
    confirmation_required: false
    reason: Web search queries a public search API with no local state mutation.
  http.fetch:
    risk_class: medium
    sensitive_contexts:
      - web
      - untrusted_web
    confirmation_required: false
    reason: HTTP fetch retrieves external content that must be treated as untrusted data.
  system.info:
    risk_class: low
    sensitive_contexts: []
    confirmation_required: false
    reason: System info reads local hardware and OS state with no side effects.
