syscall_cases:
  - id: greeting_stays_chat
    source: observed:.navi/memory.db
    message: "你好"
    expect:
      tool: respond
      permission: read

  - id: capability_question_stays_chat
    source: observed:.navi/memory.db
    message: "你可以做什么"
    expect:
      tool: tools.list
      permission: read

  - id: skills_question_uses_skills_list
    source: observed:weixin:skill_query_answered_with_tools
    message: "你都有哪些skill"
    expect:
      tool: skills.list
      permission: read

  - id: tools_question_uses_tools_list
    source: observed:weixin:tools_query_omitted_once_watch_semantics
    message: "你都有哪些工具"
    expect:
      tool: tools.list
      permission: read

  - id: local_directory_uses_shell
    source: observed:.navi/memory.db
    message: "列一下我本机的目录"
    expect:
      tool: shell.run
      permission: read

  - id: service_start_time_uses_shell
    source: observed:.navi/memory.db
    message: "你的最新启动时间是什么时候"
    expect:
      tool: shell.run
      permission: read

  - id: delegation_not_executed_uses_delegation_status_tool
    source: observed:.navi/memory.db
    message: "`8f59a0dcc92948c49f88de2df055dabf`为什么这个 delegation run 没有执行"
    expect:
      tool: goal.state
      permission: read
      args:
        run_id: "8f59a0dcc92948c49f88de2df055dabf"

  - id: vague_evening_watch_asks_clarification
    source: observed:.navi/memory.db
    message: "每天晚上上一个通识课给我"
    expect:
      tool: respond
      permission: read

  - id: exact_morning_watch_creates_watch
    source: observed:.navi/memory.db
    message: "每天早上 8 点进行毛选晨读"
    expect:
      tool: goal.open
      permission: prepare
      args:
        loop_kind: scheduled
        cron_schedule: "0 8 * * *"

  - id: git_status_uses_shell
    source: observed:manual-followup
    message: "检查 navi 仓库状态"
    expect:
      tool: shell.run
      permission: read

  - id: hermes_connector_alive_but_unresponsive
    source: https://github.com/NousResearch/hermes-agent/issues/29005
    message: "微信连接器断了但 navi.service 还在运行，帮我看连接器配置和状态"
    expect:
      tool: connector.weixin.status
      permission: read

  - id: hermes_gateway_process_status
    source: https://github.com/NousResearch/hermes-agent/issues/29005
    message: "网关进程还活着但机器人没响应，检查 navi.service 状态"
    expect:
      tool: shell.run
      permission: read

  - id: hermes_provider_config_drift
    source: https://github.com/NousResearch/hermes-agent/issues/28984
    message: "配置里的模型 provider 好像没有生效，帮我检查当前 provider 和 API key 状态"
    expect:
      tool: provider.config
      permission: read

  - id: hermes_config_runtime_contract_issue
    source: https://github.com/NousResearch/hermes-agent/issues/28984
    message: "配置项写了但运行时好像没消费，帮我检查配置到运行时的映射问题"
    expect:
      tool: goal.open
      permission: prepare

  - id: hermes_terminal_tool_latency_issue
    source: https://github.com/NousResearch/hermes-agent/pull/29006
    message: "工具调用明显变慢，帮我检查终端执行耗时和轮询问题"
    expect:
      any:
        - tool: goal.open
          permission: prepare
        - tool: shell.run
          permission: read

  - id: regression_execution_protocol_fix_request_uses_unified_loop
    source: observed:weixin:execution_protocol_evidence_must_be_list
    message: "execution protocol evidence must be a list 这是为什么，如何修复"
    expect:
      any:
        - tool: goal.open
          permission: prepare
        - tool: codebase.search
          permission: read
        - tool: respond
          permission: read

  - id: regression_terse_fix_follow_up_uses_context
    source: observed:weixin:terse_fix_follow_up
    message: "修复一下"
    conversation_context: "用户刚才问：execution protocol evidence must be a list 这是为什么。助手解释这是执行协议 schema 错误。"
    expect:
      tool: goal.open
      permission: prepare

watch_cases:
  - id: regression_deepseek_watch_notification_does_not_fail_protocol_schema
    source: observed:watch:pmp_1115_failed_verification_shape
    prompt: "pmp"
    expect:
      exit_code: 0
      summary_nonempty: true

response_cases:
  - id: greeting_does_not_suggest_command_workflow
    source: observed:.navi/memory.db
    message: "你好"
    banned:
      - "随时用"
      - "直接用"
      - "输入命令"
      - "使用命令"
      - "键入"
      - "type a command"

  - id: capabilities_do_not_suggest_command_workflow
    source: observed:.navi/memory.db
    message: "你可以做什么"
    banned:
      - "随时用"
      - "直接用"
      - "输入命令"
      - "使用命令"
      - "键入"
      - "type a command"
