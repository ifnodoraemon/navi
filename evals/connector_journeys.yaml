version: 1
connector: weixin
description: Connector-level Weixin journeys that assert user-visible IM behavior, delivery events, and state changes.
journeys:
  - id: weixin_hello_replies_and_records_events
    user_goal: Send a simple greeting from Weixin and get a visible reply plus delivery trace.
    steps:
      - inbound:
          text: "你好"
          message_id: "wx-hello"
        expect:
          handled: true
          sent_count_delta: 1
          sent_contains: "Navi received"
          event_contains:
            - message.received
            - reply.sent

  - id: weixin_provider_failure_skips_runtime_authored_reply
    provider: failing
    user_goal: Provider failure should not create a runtime-authored user reply.
    steps:
      - inbound:
          text: "你好"
          message_id: "wx-provider-failure"
        expect:
          handled: true
          sent_count_delta: 0
          event_contains:
            - message.received
            - reply.skipped

  - id: weixin_local_work_request_gets_approval
    user_goal: Ask from Weixin to fix a local problem and receive one approval task.
    steps:
      - inbound:
          text: "测试在当前项目解释器上失败了，帮我定位问题并修复"
          message_id: "wx-approval"
        expect:
          handled: true
          sent_count_delta: 1
          sent_contains: "审批码"
          run_count_delta: 1

  - id: weixin_execution_protocol_error_how_to_fix_gets_approval
    user_goal: Ask from Weixin how to fix a concrete execution protocol error and receive one approval task.
    steps:
      - inbound:
          text: "execution protocol evidence must be a list 这是为什么，如何修复"
          message_id: "wx-execution-protocol-fix"
        expect:
          handled: true
          sent_count_delta: 1
          sent_contains: "审批码"
          run_count_delta: 1

  - id: weixin_terse_fix_follow_up_uses_previous_error_context
    user_goal: Continue a previous concrete error from Weixin with a terse fix request instead of receiving a contextless clarification.
    steps:
      - inbound:
          text: "execution protocol evidence must be a list 这是为什么"
          message_id: "wx-execution-protocol-why"
        expect:
          handled: true
          sent_count_delta: 1
          run_count_delta: 0
      - inbound:
          text: "修复一下"
          message_id: "wx-execution-protocol-follow-up"
        expect:
          handled: true
          sent_count_delta: 1
          sent_contains: "审批码"
          run_count_delta: 1

  - id: weixin_exact_schedule_creates_watch
    user_goal: Schedule a recurring lesson through Weixin with an exact time.
    steps:
      - inbound:
          text: "每天晚上 8 点讲解通识知识"
          message_id: "wx-watch"
        expect:
          handled: true
          sent_count_delta: 1
          scheduled_goal_count_delta: 1
          scheduled_goal_status: scheduled

  - id: weixin_time_only_push_asks_for_a_date
    user_goal: Ask for a time-only push and clarify the missing date instead of inventing recurrence.
    steps:
      - inbound:
          text: "15:30的时候给我推送一下pmp相关知识"
          message_id: "wx-once-watch"
        expect:
          handled: true
          sent_count_delta: 1
          scheduled_goal_count_delta: 0

  - id: weixin_skills_query_distinguishes_skills_from_tools
    user_goal: Ask for skills through Weixin and receive actual procedural skills, not callable tools.
    steps:
      - inbound:
          text: "你都有哪些skill"
          message_id: "wx-skills-list"
        expect:
          handled: true
          sent_count_delta: 1
          run_count_delta: 0
          sent_contains_any:
            - "code-navigator"
            - "memory-curator"
          sent_not_contains_any:
            - "goal.open"
            - "shell.run"

  - id: weixin_tools_query_distinguishes_tools_from_skills
    user_goal: Ask for tools through Weixin and receive capabilities from the current registry.
    steps:
      - inbound:
          text: "你都有哪些工具"
          message_id: "wx-tools-list"
        expect:
          handled: true
          sent_count_delta: 1
          run_count_delta: 0
          sent_contains_any:
            - "goal.open"
            - "goal.state"
          sent_contains: "loop_kind"
          sent_not_contains_any:
            - "code-navigator"
            - "memory-curator"

  - id: weixin_vague_reminder_clarifies_without_watch
    user_goal: Ask an underspecified reminder through Weixin and get a clarification, not a bogus watch.
    steps:
      - inbound:
          text: "明天上午提醒我看 PR"
          message_id: "wx-vague"
        expect:
          handled: true
          sent_count_delta: 1
          sent_contains_any:
            - "Navi received"
            - "几点"
            - "exact recurring"
          run_count_delta: 0
          scheduled_goal_count_delta: 0

  - id: weixin_duplicate_message_is_ignored
    user_goal: Ensure duplicate Weixin delivery does not create duplicate replies.
    steps:
      - inbound:
          text: "你好"
          message_id: "wx-duplicate"
        expect:
          handled: true
          sent_count_delta: 1
      - inbound:
          text: "你好"
          message_id: "wx-duplicate"
        expect:
          handled: false
          sent_count_delta: 0
          event_contains:
            - message.duplicate
