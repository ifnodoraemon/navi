  - task_id: navi_public_language_translation_learning
    split: general
    category: language_translation
    language: zh
    fixture: none
    query: "把这句翻译成英文并说明语气：本地优先，不等于没有云端能力"
    rubric_dimensions: [completion, robustness]
    journey:
      steps:
        - user: "把这句翻译成英文并说明语气：本地优先，不等于没有云端能力"
