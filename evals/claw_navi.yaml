    journey:
      steps:
        - user: "把这段客户邮件改得更清楚、更克制：我们还在排查，请耐心等待"
          expect:
            action: chat
            run_count_delta: 0

  - task_id: navi_public_chatgpt_decision_support
    split: general
    category: consumer_decision_support
    language: zh
    fixture: none
    query: "帮我判断这个功能是先做 CLI 还是先做连接器入口，列出取舍"
