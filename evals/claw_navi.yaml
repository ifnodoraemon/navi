  - task_id: navi_public_information_practices_local_identifying
    split: general
    category: research_reading
    language: zh
    fixture: local_repo
    query: "先读 README.md，识别这个项目解决的核心问题"
    rubric_dimensions: [completion, robustness]
    journey:
      steps:
        - user: "先读 README.md，识别这个项目解决的核心问题"
          expect:
            action: tool
            run_count_delta: 0
            text_contains_any:
              - "README"
              - "Navi"

  - task_id: navi_public_consumer_self_care_boundary
    split: general
    category: consumer_practical_guidance
    language: zh
    fixture: none
