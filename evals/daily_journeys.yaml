version: 1
description: User-facing daily journeys. These evals assert externally visible behavior and state changes, not internal tool preferences.
source_references:
  - https://openai.com/index/how-people-are-using-chatgpt/
  - https://openai.com/business/guides-and-resources/the-state-of-enterprise-ai-2025-report/
  - https://www.anthropic.com/research/economic-index-geography
  - https://arxiv.org/abs/2507.05537
  - https://arxiv.org/abs/2503.04761
journeys:
  - id: casual_chat_does_not_create_task
    user_goal: Say hello and get a direct response.
    steps:
      - user: "你好"
        expect:
          action: chat
          run_count_delta: 0

  - id: local_work_request_gets_one_approval_task
    user_goal: Ask Navi to fix a local project problem and receive one prepared task awaiting approval.
    steps:
      - user: "测试在当前项目解释器上失败了，帮我定位问题并修复"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
          goal_status: awaiting_approval
          text_contains: "审批码"

  - id: approval_then_background_execution_completes_goal
    user_goal: Approve the prepared local task, let the background executor process it, and see durable goal completion.
    steps:
      - user: "测试在当前项目解释器上失败了，帮我定位问题并修复"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
          goal_status: awaiting_approval
      - user: "批准 {{approval_code}}"
        expect:
          action: approval
          run_count_delta: 0
          run_status: queued
      - process_pending: true
        expect:
          run_status: completed
          goal_status: verified_complete

  - id: recurring_evening_lesson_creates_watch
    user_goal: Schedule a recurring daily lesson with an exact time.
    steps:
      - user: "每天晚上 8 点讲解通识知识"
        expect:
          action: watch
          watch_count_delta: 1

  - id: vague_reminder_asks_clarification
    user_goal: Ask for an underspecified one-off reminder and get a clarification question instead of a bogus watch.
    steps:
      - user: "明天上午提醒我看 PR"
        expect:
          action: ask
          run_count_delta: 0
          watch_count_delta: 0

  - id: user_can_ask_current_task_list
    user_goal: Ask what tasks Navi currently has after creating one.
    steps:
      - user: "测试在当前项目解释器上失败了，帮我定位问题并修复"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
      - user: "现在有哪些任务"
        expect:
          action: tool
          run_count: 1
          text_contains_any:
            - "runs"
            - "awaiting_approval"
            - "awaiting approval"

  - id: user_can_ask_why_task_not_executed
    user_goal: Ask why the current task has not executed yet and get task status rather than a new task.
    steps:
      - user: "测试在当前项目解释器上失败了，帮我定位问题并修复"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
      - user: "{{run_id}} 为什么还没执行"
        expect:
          action: tool
          run_count: 1
          text_contains_any:
            - "awaiting_approval"
            - "awaiting approval"
            - "approvals"

  - id: user_can_reject_pending_task
    user_goal: Reject a prepared task and see it move to rejected without execution.
    steps:
      - user: "测试在当前项目解释器上失败了，帮我定位问题并修复"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
      - user: "拒绝 {{approval_code}}"
        expect:
          action: approval
          run_count_delta: 0
          run_status: rejected
          goal_status: rejected

  - id: user_can_clean_failed_tasks
    user_goal: Clean up failed task leftovers after Navi reports them.
    steps:
      - seed_failed_run:
          title: "old failed watch run"
          source: watch
          kind: delegation
        expect:
          failed_run_count: 1
      - user: "清理失败任务"
        expect:
          action: delegation
          failed_run_count: 0

  - id: user_can_check_model_provider_status
    user_goal: Ask whether model provider configuration is active without creating a task.
    steps:
      - user: "配置里的模型 provider 好像没有生效，帮我检查当前 provider 和 API key 状态"
        expect:
          action: tool
          run_count_delta: 0
          text_contains_any:
            - "provider"
            - "api_base_url"

  - id: user_can_check_connector_status
    user_goal: Ask why Weixin is not responding and get connector status facts without creating a task.
    steps:
      - user: "微信连接器断了但 navi.service 还在运行，帮我看连接器配置和状态"
        expect:
          action: tool
          run_count_delta: 0
          text_contains_any:
            - "configured"
            - "status"

  - id: writing_editing_no_task
    user_goal: Edit a short piece of writing directly without creating a local task.
    public_basis: openai_usage_writing_common_work_task
    steps:
      - user: "把这句话改得更像产品说明：我们让 AI 可以安全地调用本地工具"
        expect:
          action: chat
          run_count_delta: 0

  - id: decision_support_no_task
    user_goal: Ask for a decision framework and receive advice without local execution.
    public_basis: openai_usage_asking_decision_support
    steps:
      - user: "我应该先做微信连接器稳定性，还是先做 prompt operating system？帮我分析取舍"
        expect:
          action: chat
          run_count_delta: 0

  - id: translation_language_no_task
    user_goal: Translate product text without spawning a task.
    public_basis: anthropic_language_learning_translation
    steps:
      - user: "把这句翻译成英文：Navi 是本地优先的 agentic assistant"
        expect:
          action: chat
          run_count_delta: 0

  - id: local_readme_context_tool
    user_goal: Read local project context before summarizing a repository.
    public_basis: information_needs_identifying_research_reading
    steps:
      - user: "先读 README.md，再告诉我这个项目最适合谁使用"
        expect:
          action: tool
          run_count_delta: 0
          text_contains_any:
            - "README"
            - "Navi"

  - id: data_analysis_report_needs_approval
    user_goal: Analyze a local CSV and produce a report through the approval workflow.
    public_basis: openai_enterprise_spreadsheet_analysis_automation
    steps:
      - user: "分析 data/usage.csv，找出异常趋势并写一份报告"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval
          goal_status: awaiting_approval

  - id: customer_support_triage_needs_approval
    user_goal: Turn a local support-ticket corpus into a structured triage workflow.
    public_basis: openai_enterprise_customer_experience
    steps:
      - user: "读取 support_tickets.csv，按紧急程度归类客户问题并生成处理建议"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval

  - id: privacy_redaction_needs_approval
    user_goal: Redact possible secrets in local logs through controlled work.
    public_basis: enterprise_security_privacy_workflow
    steps:
      - user: "扫描 logs/ 里的 token 和邮箱，脱敏后补一个检查脚本"
        expect:
          action: approval
          run_count_delta: 1
          run_status: awaiting_approval

  - id: exact_one_shot_reminder_creates_once_watch
    user_goal: Create a concrete one-shot reminder without converting it into a recurring watch.
    public_basis: openai_usage_planning_scheduling
    steps:
      - user: "15:30 提醒我检查 PR 评论"
        expect:
          action: watch
          watch_count_delta: 1
          watch_kind: once
          watch_cron: once

  - id: broad_health_self_care_no_task
    user_goal: Ask for general self-care guidance without local action or medical claims.
    public_basis: openai_usage_practical_guidance
    steps:
      - user: "我最近睡眠很乱，给我一个非医疗性质的作息调整思路"
        expect:
          action: chat
          run_count_delta: 0

  - id: finance_legal_explanation_no_task
    user_goal: Ask for a general legal/finance concept explanation without treating it as professional advice.
    public_basis: consumer_ai_advice_boundaries
    steps:
      - user: "解释一下 SaaS 合同里的 indemnity 条款通常是什么意思，不要当成法律意见"
        expect:
          action: chat
          run_count_delta: 0
